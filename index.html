<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LapStock — Sistem Informasi Manajemen Inventaris Stok Laptop Bekas</title>
  <meta name="description" content="Sistem Informasi Manajemen Inventaris Stok Laptop Bekas berbasis web untuk pengelolaan nomor seri, grade kondisi fisik, riwayat modifikasi teknis, transaksi kasir, dan laporan toko." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Demo Role Switcher Bar (Facilitates IMK Evaluation Across 5 Roles) -->
  <div id="demo-bar" class="demo-bar no-print" role="region" aria-label="Pengalih Peran Demo">
    <div class="demo-bar-inner">
      <div class="demo-bar-left">
        <span class="demo-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Demo Peran:
        </span>
        <span id="demo-page-code" class="demo-page-code">[PU-01]</span>
      </div>
      <div class="demo-role-pills" id="demo-role-pills">
        <button type="button" class="demo-pill" data-switch-role="pelanggan">Pelanggan (Publik)</button>
        <button type="button" class="demo-pill" data-switch-role="admin_gudang">Admin Gudang</button>
        <button type="button" class="demo-pill" data-switch-role="teknisi">Teknisi</button>
        <button type="button" class="demo-pill" data-switch-role="kasir">Kasir</button>
        <button type="button" class="demo-pill" data-switch-role="pemilik">Pemilik Toko</button>
      </div>
      <div class="demo-bar-right">
        <button type="button" id="btn-test-403" class="demo-btn-danger" title="Simulasikan akses URL di luar kewenangan peran">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Uji Akses Ditolak
        </button>
        <button type="button" id="btn-reset-demo" class="demo-btn-ghost" title="Kembalikan seluruh data demo ke kondisi awal">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Reset
        </button>
        <button type="button" id="btn-toggle-demo" class="demo-btn-icon" aria-label="Sembunyikan bar demo" title="Ciutkan bar demo">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
      </div>
    </div>
  </div>
  <button type="button" id="demo-bar-restore" class="demo-restore-btn no-print hidden" title="Tampilkan Bar Demo Peran">
    Demo Peran <span id="demo-restore-code">[PU-01]</span> ▾
  </button>

  <!-- Main App Root -->
  <div id="app" class="app-root"></div>

  <!-- Slide-over Quick Detail Drawer (TR-01 & Mobile Nav) -->
  <div id="drawer-backdrop" class="drawer-backdrop no-print hidden" aria-hidden="true"></div>
  <aside id="drawer-panel" class="drawer-panel no-print hidden" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-header">
      <h3 id="drawer-title" class="drawer-title">Detail Cepat</h3>
      <button type="button" id="drawer-close" class="icon-btn" aria-label="Tutup panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
    <div id="drawer-footer" class="drawer-footer hidden"></div>
  </aside>

  <!-- Global Modal Dialog -->
  <div id="modal-backdrop" class="modal-backdrop no-print hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card" id="modal-card">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Konfirmasi</h3>
        <button type="button" id="modal-close" class="icon-btn" aria-label="Tutup dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Notification Container (Bottom-right, non-intrusive, max 3 stacked) -->
  <div id="toast-container" class="toast-container no-print" aria-live="polite" aria-atomic="true"></div>

  <!-- Scripts -->
  <script src="js/svg.js"></script>
  <script src="js/data.js"></script>
  <script src="js/views/public.js"></script>
  <script src="js/views/auth.js"></script>
  <script src="js/views/inventory.js"></script>
  <script src="js/views/technician.js"></script>
  <script src="js/views/sales.js"></script>
  <script src="js/views/reports_users.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
